name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: dotnet test FactoryCutPlanner.slnx -c Release

  publish-windows:
    name: Publish Windows executable
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained single file: runs on a Windows PC without .NET installed.
      - name: Publish win-x64
        run: >
          dotnet publish FactoryCutPlanner/FactoryCutPlanner.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FactoryCutPlanner-win-x64
          # Only the executable: the publish folder also holds ~100 MB of debug symbols.
          path: publish/FactoryCutPlanner.exe
          if-no-files-found: error
